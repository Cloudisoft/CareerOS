# Builds the CareerOS Interview Companion desktop installers.
# Run it from GitHub → Actions → "Desktop companion" → Run workflow, or push a tag like companion-v1.0.0.
# The installers appear as downloadable artifacts on the run; upload them where /download links to
# (see desktop-companion/README.md).
name: Desktop companion

concurrency:
  group: companion-release-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop-companion/**"
      - ".github/workflows/desktop-companion.yml"
  push:
    branches: ["main"]
    paths:
      - "desktop-companion/**"
      - ".github/workflows/desktop-companion.yml"
    tags: ["companion-v*"]

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: desktop-companion/dist/*.dmg
          - os: windows-latest
            script: dist:win
            files: desktop-companion/dist/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build
        shell: bash
        env:
          # Signing secrets are optional. They're passed through only when set: an empty CSC_LINK makes
          # electron-builder treat the app folder as the certificate and fail ("not a file").
          SECRET_CSC_LINK: ${{ secrets.CSC_LINK }}
          SECRET_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$SECRET_CSC_LINK" ]; then
            export CSC_LINK="$SECRET_CSC_LINK" CSC_KEY_PASSWORD="$SECRET_CSC_KEY_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "No signing certificate: building an unsigned installer."
          fi
          if [ -n "$SECRET_APPLE_ID" ]; then
            export APPLE_ID="$SECRET_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$SECRET_APPLE_APP_SPECIFIC_PASSWORD" APPLE_TEAM_ID="$SECRET_APPLE_TEAM_ID"
          fi
          npm run ${{ matrix.script }} -- --publish never
      - name: List installer checksums
        shell: bash
        run: |
          ls -lh dist/
          sha256sum dist/*.dmg dist/*.exe 2>/dev/null || true
      - name: Publish release to CareerOS private downloads bucket
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/publish-installers.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: careeros-interview-companion-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
