name: Companion v2 checks

on:
  pull_request:
    paths:
      - 'desktop-companion/**'
      - 'src/app/api/extension/interview/copilot/**'
      - '.github/workflows/companion-v2-checks.yml'
  workflow_dispatch:

jobs:
  desktop-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer/app.js
      - name: Electron end-to-end tests
        run: xvfb-run -a npm test
