<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <title>CareerOS Interview Prep</title>
</head>
<body>
  <header class="top">
    <div class="brandMark"><img src="../icons/icon128.png" alt=""></div>
    <div class="topText">
      <strong class="brandName">Interview Prep</strong>
      <span id="tagline">CareerOS</span>
    </div>
  </header>

  <section id="signin" class="card" hidden>
    <h2>Sign in to CareerOS</h2>
    <p class="muted">One click. You'll approve it on the CareerOS site, where you're already signed in.</p>
    <button id="connectBtn" class="btn">Sign in</button>
    <p class="muted" id="connectMsg" style="margin-top:8px"></p>
    <details style="margin-top:12px">
      <summary class="muted">Have a pairing code instead?</summary>
      <div class="row" style="margin-top:8px">
        <input id="codeInput" maxlength="6" placeholder="ABC123" style="text-transform:uppercase">
        <button id="pairBtn" class="btn ghost">Pair</button>
      </div>
      <p class="muted" id="pairMsg" style="margin-top:6px"></p>
    </details>
  </section>

  <section id="home" class="card" hidden>
    <p class="muted" id="pairedAs"></p>
    <button id="openInterview" class="btn">Continue mock interview</button>
    <button id="openStories" class="btn ghost">My Stories</button>
    <button id="signOut" class="linkBtn">Sign out</button>
  </section>

  <!-- Live Copilot: a distinct, opt-in feature — only shown at all when the
       active tab is a call platform, and never enabled without consent. -->
  <section id="liveCopilot" class="card liveCard" hidden>
    <h2>Live Copilot <span class="beta">Beta · Opt-in</span></h2>

    <div id="lcConsent" hidden>
      <p class="muted" id="lcConsentText"></p>
      <label class="checkRow">
        <input type="checkbox" id="lcConsentCheck">
        <span>I understand and agree.</span>
      </label>
      <button id="lcConsentContinue" class="btn" disabled>Continue</button>
    </div>

    <div id="lcControls" hidden>
      <label class="muted" for="lcJobSelect">Which interview is this?</label>
      <select id="lcJobSelect"></select>
      <p class="muted" id="lcUpgradeMsg" hidden>Company Interview Preparation (Premium+) is required for Live Copilot hints.</p>

      <button id="lcTestBtn" class="btn ghost">Test call (30s)</button>
      <div id="lcMeter" class="meter" hidden><div id="lcMeterFill" class="meterFill"></div></div>
      <p class="muted" id="lcTestResult"></p>

      <button id="lcStartBtn" class="btn">Start Live Copilot</button>
      <button id="lcStopBtn" class="btn ghost" hidden>Stop Live Copilot</button>
      <p class="muted" id="lcStatus"></p>
    </div>
  </section>
</body>
<script src="../lib/storage.js"></script>
<script src="../lib/api.js"></script>
<script src="../lib/live-copilot.js"></script>
<script src="popup.js"></script>
</html>
